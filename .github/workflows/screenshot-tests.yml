name: Compose screenshot tests

on:
  pull_request:
    paths-ignore: [ "docs/**", "fastlane/**", "**.md" ]
  push:
    branches: [ "main" ]
    paths-ignore: [ "docs/**", "fastlane/**", "**.md" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SKIP_RELEASE_SIGNING: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate screenshots
        run: ./gradlew :app:validateDebugScreenshotTest

      - name: Upload screenshot report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-screenshot-report
          path: app/build/reports/screenshotTest/preview/debug/
          if-no-files-found: ignore
