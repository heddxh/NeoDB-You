name: Nightly build

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "docs/**", "fastlane/**", "**.md" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          set -e
          SHA=${{ github.sha }}
          echo "Release version is: $SHA"
          
          APK_DIR="app/build/outputs/apk/release"
          mv ${APK_DIR}/app-release.apk NeoDB-You-nightly-${SHA}.apk
          echo "APK renamed to NeoDB-You-nightly-${SHA}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NeoDB-You-nightly-${{ github.sha }}.apk
          path: NeoDB-You-nightly-${{ github.sha }}.apk
          archive: false

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          name: Nighly
          prerelease: true
          removeArtifacts: true
          artifacts: NeoDB-You-nightly-${{ github.sha }}.apk
